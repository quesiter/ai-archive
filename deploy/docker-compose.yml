name: ai-conversation-archive

services:
  host-monitor:
    image: ${ARCHIVE_IMAGE:-ai-conversation-archive:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    cgroup: host
    cgroup_parent: ${ARCHIVE_CGROUP_PARENT:-ai-conversation-archive}
    command: ["node", "dist/host-monitor.js"]
    environment:
      HOST_MONITOR_PORT: 9091
      HOST_PROC_ROOT: /host/proc
      HOST_CGROUP_ROOT: /host/cgroup
      HOST_PROJECT_CGROUP: ${ARCHIVE_CGROUP_PARENT:-ai-conversation-archive}
      HOST_SAMPLE_INTERVAL_MS: ${HOST_SAMPLE_INTERVAL_MS:-10000}
      HOST_HISTORY_LIMIT: ${HOST_HISTORY_LIMIT:-27}
      TZ: Asia/Shanghai
    volumes:
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
    expose:
      - "9091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    cgroup_parent: ${ARCHIVE_CGROUP_PARENT:-ai-conversation-archive}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archive}
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${ARCHIVE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive} -d ${POSTGRES_DB:-archive}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Required by the official entrypoint to fix volume ownership and switch
    # to the unprivileged postgres account during startup.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  app:
    image: ${ARCHIVE_IMAGE:-ai-conversation-archive:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    cgroup_parent: ${ARCHIVE_CGROUP_PARENT:-ai-conversation-archive}
    command: ["sh", "-c", "node dist/migrate.js && node dist/index.js"]
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-archive}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set APP_MASTER_KEY}
      COOKIE_SECURE: "true"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      EXTENSION_ORIGINS: ${EXTENSION_ORIGINS:-chrome-extension://daolmhnfgimkgnnadojnmhkkjdolplfi}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-false}
      IMPORT_INBOX: /data/imports/inbox
      IMPORT_PROCESSED: /data/imports/processed
      IMPORT_FAILED: /data/imports/failed
      COMPONENT_RELEASE_DIR: /app/release
      HOST_MONITOR_URL: http://host-monitor:9091
      ARCHIVE_STORAGE_BUDGET_GB: ${ARCHIVE_STORAGE_BUDGET_GB:-}
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_DIST: /app/apps/web/dist
    volumes:
      - ${ARCHIVE_DATA_DIR:-./data}/imports:/data/imports
    ports:
      - "127.0.0.1:${ARCHIVE_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    image: ${ARCHIVE_IMAGE:-ai-conversation-archive:latest}
    restart: unless-stopped
    cgroup_parent: ${ARCHIVE_CGROUP_PARENT:-ai-conversation-archive}
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-archive}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set APP_MASTER_KEY}
      IMPORT_INBOX: /data/imports/inbox
      IMPORT_PROCESSED: /data/imports/processed
      IMPORT_FAILED: /data/imports/failed
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${ARCHIVE_DATA_DIR:-./data}/imports:/data/imports
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
